name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Guard - no game files tracked in version control
        shell: bash
        run: scripts/check-no-game-files.sh
      # No game jar is available in CI (bring your own jar): the :game module is skipped, the build covers midp, port, buildtools and desktop,
      # and `check` runs :desktop:checkNoGameContent on the fat jar. The pinned decompile tools are fetched from Maven (SHA-256 verified).
      # The full pipeline (build with a jar + determinism trace) is an opt-in developer check, see docs/byo-jar.md.
      - name: Build and test
        run: ./gradlew build -PnoGame --no-daemon
