name: Minimal ffmpeg

# Builds the minimal AMR-NB -> WAV ffmpeg (scripts/ffmpeg) on all three OSes, prints version / size / dependencies and decodes a synthetic
# AMR file generated by the test script (no game data). Run it by hand (Actions > Minimal ffmpeg > Run workflow, pick the branch)
# or by pushing a change under scripts/ffmpeg or .github/actions/minimal-ffmpeg.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ffmpeg/**'
      - '.github/actions/minimal-ffmpeg/**'
      - '.github/workflows/ffmpeg.yml'

permissions:
  contents: read

jobs:
  build:
    name: ffmpeg (${{ matrix.key }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: linux,   runner: ubuntu-22.04 }   # old glibc (2.35) so the binary runs on older distributions
          - { key: windows, runner: windows-latest }
          - { key: macos,   runner: macos-latest }   # arm64, same as release.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/minimal-ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.key }}
          if-no-files-found: error
          path: ffmpeg-out
