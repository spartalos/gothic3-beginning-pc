# 3D models for object sprites (docs/render3d.md, "Props").  Key = image id [@ source rect], value = tokens.
#   i<N>              images[N] (objects, items, effects; recolour variants share the rule)     s<G>.<S> animated character sheets
#   i<N>@x,y,w,h      only this frame (source rect on the sheet)
# Tokens: card | voxel[:depthTiles|auto] | lathe[:sides] | cross | lie[:heightTiles] | table[:heightTiles[:cutRows]] | float | light:RRGGBB:radius:height[:intensity]
#   voxel  = the sprite extruded (exact pixel art in front, edge pixels on the sides), depth in tiles (auto = 0.45 * width)
#   lathe  = silhouette revolved around the vertical axis (round things), cross = two crossed cards (bushes)
#   lie    = lying object drawn top-down in 2D (bed, sled, corpse): the art is the top of a low box of the given height (default 0.35)
#   table  = top-down furniture drawn in the game's floor pass (art = the tabletop seen from above): top at the given height (default 0.45), solid body below;
#            cutRows = pedestal rows at the bottom of the sprite that are left out of the top.  Floor-pass (flat) sprites only get a model when listed here.
#   float  = do not lower the sprite onto the floor (mounted / hanging things)
#   light  = fire: warm colour, radius in tiles, height above the feet in tiles, optional intensity (flickers, render3d.pointLights)
# Ids are listed by -Dg3.render3d.propdump=<dir> (writes a crop per distinct sprite).  F6 reloads this file.
default.object = voxel:auto
default.sheet  = card

# --- fires
i11 = voxel:0.12 light:ff9040:3.2:1.7        # wall torch
i12 = voxel:0.5 light:ff8a30:4.0:0.8         # camp fire (tripod)
