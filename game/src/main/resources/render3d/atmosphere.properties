# Atmosphere data for the 3D view (docs/render3d.md "Atmosphere"). Reload: F6 (or options screen). Cosmetic only.
#
# Weather per map: snow | dust | none. Lookup order: mapN, then the layer-1 tileset (tsN), then the layer-0 tileset, then default.
default = none
ts0 = snow          # layer-0 tileset 0 = snowy ground (village, temples, arenas outdoors)
ts3 = snow          # village building set
ts5 = dust          # start house interior
ts6 = dust          # temple interiors
# map13 = dust      # per-map override example

# Windows: window.tsN = bright|dark : layer-1 tile ids. bright = the opening is a bright patch of the tile (interiors: light shafts
# fall through it), dark = a dark opening (exteriors: glows warm at night).
window.ts5 = bright:18,20
window.ts3 = dark:8,9,16
