# Extra point lights for the 3D view (docs/render3d.md "Extra light sources"): wall lamps, candles, windows.  Fires (torches, braziers,
# camp fires) stay in props.properties (light: token).  F6 reloads this file.  atmo.lights / atmo.lights.strength / atmo.lights.flicker.
#
# preset.NAME = RRGGBB:radius(tiles):intensity:flicker     flicker 0 = steady, 1 = like a fire
preset.lamp    = ffb050:4.2:1.15:0.45    # glowing wall lamp (art: warm blob on the wall)
preset.candle  = ffa850:2.6:1.0:0.8
preset.stained = a8b4ec:3.4:0.22:0        # stained glass window, cool and soft
#
# Tile lights (layer-1 tile of a tileset):  tsN.TILE = preset:fx:fy:dz
#   fx / fy = position inside the tile (0..1, y from the top edge), dz = tiles towards the room (south) from the wall plane
# A lamp is drawn over two stacked tiles; the light sits at the top edge of the lower one.
ts4.7  = lamp:0.48:0.0:0.35       # castle crypt / abbey wall lamp
ts4.27 = lamp:0.48:0.0:0.35
ts5.16 = lamp:0.48:0.0:0.35       # house interior wall lamp (Idra's home, start hut)
ts4.15 = stained:0.5:0.5:0.6      # stained glass window (middle piece, two cells wide)
#
# Sprite lights:  iN[@x,y,w,h] = preset:px:py:height ...    (pixel inside the sprite, height above the floor in tiles)
i196 = candle:4:8:0.75 candle:27:8:0.75        # temple altar / sarcophagus candles
#
# Windows (found by atmosphere.properties window.tsN): interior bright windows are cool by day and warm at night, exterior dark windows
# are lit at night only.   RRGGBB:radius:intensity
win.bright       = 9db4e6:3.0:0.30
win.bright.night = ffb464:3.0:0.35
win.dark.night   = ffaa55:2.8:0.70
