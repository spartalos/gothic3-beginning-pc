# Overall graphics quality presets (F10 > 3D / Atmosphere > Graphics quality), read by gothic3.desktop.GraphicsPresets.
# One row per config key, one column per preset:   key = low | medium | high | ultra
#   '-'  the key is not part of that preset (left as the user has it, ignored when matching)
# Choosing a preset writes every row of its column (after resetting the post.* sliders to the "subtle" baseline); the label shown in the options
# screen is computed by comparing the config with each column, so a config that matches no column (or any single setting changed later) shows "Custom".
# Rules: the High column must equal the built-in defaults in Config.java (a fresh config shows "High"); a key that has no default in Config.java
# (an effect that is not in this build) is skipped, so a new effect is added with ONE line here and an old build ignores it.
# docs/render3d.md "Graphics quality presets" has the cost numbers these values were chosen from.

# ---- shadows and lights
render3d.shadows        = low   | low   | high  | high
atmo.softShadows        = false | true  | true  | true
atmo.shadow.contact     = false | false | false | true
render3d.pointLights.max = 6    | 10    | 12    | 20
atmo.lights             = false | true  | true  | true
atmo.normals            = false | true  | true  | true
atmo.ice                = false | true  | true  | true
atmo.rim                = false | true  | true  | true
atmo.shafts             = false | false | true  | true

# ---- particles and motion
atmo.sway               = false | true  | true  | true
atmo.snow.density       = 0.5   | 0.8   | 1.0   | 1.6
atmo.embers.density     = 0.5   | 0.8   | 1.0   | 1.0
atmo.dust.density       = 0.5   | 0.8   | 1.0   | 1.5
atmo.smoke              = false | false | false | true

# ---- effects from other branches (skipped while the key does not exist in Config.java)
atmo.ao                 = true  | true  | true  | true
atmo.snowSparkle        = false | false | true  | true
atmo.snowSheen          = false | false | true  | true

# ---- post-processing: named post preset (off | subtle) or custom + sliders. post.preset is applied last.
post.preset             = off   | custom | subtle | subtle
post.dof                = -     | false  | -      | -
post.ssao               = -     | false  | -      | -
