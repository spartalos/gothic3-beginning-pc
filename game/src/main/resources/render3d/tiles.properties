# 3D tile table (docs/render3d.md). Reload at runtime with F6.
default.layer0 = floor
default.layer1 = upright

# --- village tileset (layer 0 set 0, layer 1 set 3): snowy roofs lean back, the rest of layer 1 (walls, doors) stands upright
ts3.layer1.0-1 = slope:55
ts3.layer1.23-34 = slope:55
ts3.layer1.41-45 = slope:55
ts3.layer1.47-50 = slope:55
# solid volumes (stone tower, village walls) - block side faces + top cap
ts3.layer1.2-10 = block:1
ts3.layer1.35-39 = block:1
ts3.layer1.12-22 = block:1
ts3.layer1.46 = block:1
ts3.layer1.51-54 = block:1
# layer 0 black "inside of a building" cells show ground instead (the roof no longer covers them in 3D)
ts0.layer0.29 = floor:7
ts0.void = 7

# --- reflective ice (IceLayer, atmo.ice): layer-0 tile ids that are ice: `ice` (any tileset), `ice.tsN` (layer-0 tileset N), `ice.mapN` (map N only).
# Tile 6 is the frozen sea / lake (maps 42 and 47), 30-33 are its shore tiles (half snow: only the dark blue ice texels reflect).
# These lines are not layer shape rules: the shape table and the tile editor ignore / keep them.
ice.ts0 = 6, 30-33

# --- snow sparkle / sheen (SnowSparkle, atmo.snowSparkle / atmo.snowSheen): tiles that carry snow. `snow` / `snow.tsN` / `snow.mapN` = layer-0 ids,
# `snow1` / `snow1.tsN` / `snow1.mapN` = layer-1 ids (snowy roofs, caps). Inside these tiles the art decides per texel (bright, low saturation),
# so footprints, stones, grass and the blue ice of the shore tiles stay matt. Not layer shape rules: the shape table ignores them.
snow.ts0 = 0-2, 7-12, 15-26, 30-33
snow1.ts3 = 0-1, 9, 11, 20, 23-26, 28-34, 37, 40-45, 47-50
# interior set (5): wooden stairs in doorways are real steps going down towards the viewer (a raised room with steps leading up)
ts5.layer0.32 = steps:4
ts5.layer0.28 = steps:2
ts5.layer0.3 = upright
ts5.layer0.19 = upright
ts5.layer0.4 = flat
ts5.layer0.20 = flat

# --- village set, layer 0: the wooden podium (4x3 cells; rows 1-2 = plank deck, row 3 = its front: legs 36, shade 40, stairs 39).
# Deck tiles become a raised platform (top at 0.75 with solid front / side faces), the stairs rise to it, the leg art on the ground is replaced by plain snow.
ts0.layer0.34-35 = deck:0.75
ts0.layer0.37-38 = deck:0.75
ts0.layer0.39 = stairs:5:0.75
ts0.layer0.36 = floor:0

# --- village set, layer 0 tiles 27 / 28: stairs with rails (they were mistaken for fences). Seen in the village north wall gap, in the area 3 courtyard wall gap and
# in the palisade set: a straight run of cells climbs to the north, 3 treads per cell, 0.3 tiles per cell.
ts0.layer0.27-28 = flight:3:0.3

# --- area 41: the snowy ruin (stone ring around a plank floor with a skeleton, two gate posts). The structure builder read the ring as one
# 4 levels high solid block (its pieces are top-down / oblique art of low wall tops) that swallowed the plank floor and the skeleton.
# The plank floor (layer 0, would be a raised deck like the village podium) stays on the ground, the wall pieces lie on the ground as in the
# 2D art (the 1 row high back wall, tile 35, stays a normal low wall), the gate posts 52 / 53 are crossed cards. Map specific: the same
# tile ids in houses / towers elsewhere are untouched.
map41.layer0.38 = floor
map41.layer1.4 = flat
map41.layer1.6 = flat
map41.layer1.10-11 = flat
map41.layer1.37-38 = flat
map41.layer1.40 = flat
map41.layer1.52-53 = cross

# --- caves (tileset 7: random cave maps, render3d.cave.tilesets). The 2D art draws every rock mass as a 3 tile high rock face (ids 5-13, three columns of three rows)
# with black cap / edge tiles (14-17) above and around it. Built as extruded boxes the masses hid the corridors behind them (unplayable), so the dollhouse cutaway
# is: the three face rows are a low ramp (80 deg lean from vertical = 0.17 rise per row, 0.5 at the ridge; the camera hides only 1.28 x height of ground behind it,
# less than the black cap rows behind it) and the black tiles lie flat on the ground, exactly as the 2D art shows them: no tall wall, no brown top.
ts7.layer1.5 = slope:78
ts7.layer1.7 = slope:78
ts7.layer1.10 = slope:78
ts7.layer1.13 = slope:78
ts7.layer1.15 = flat
ts7.layer1.17 = flat
ts7.layer1.8-9 = upright
ts7.layer1.11-12 = upright
ts7.layer1.6 = upright
ts7.layer1.14 = flight:1:0.3
ts7.layer1.16 = deck:3.75

# --- castle crypt interiors (tileset 4, areas 15-18 / 24 / 48): the plain brick wall between the windows of the north wall is drawn on LAYER 0 (ids 1-3, rows 0-2, not walkable) in the big
# hall (map 48), so it was a floor decal: holes in the wall. Standing pieces; a vertical run of them is one wall of render3d.structures.uniformWall tiles (MapMesh l0WallH).
ts4.layer0.1-3 = upright
